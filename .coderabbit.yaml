# Enables IDE autocompletion for this config file
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# Language for CodeRabbit's review comments
language: en

# Enable experimental features (currently not using any specific early_access features)
early_access: true

# Multi-repo analysis: lets CodeRabbit use other repositories as context when reviewing PRs.
# Most useful when linking tightly coupled repos, e.g.:
#   - Frontend ↔ backend (API contract changes)
#   - Service ↔ shared library (ripple-effect on consumers)
#   - Microservices sharing a database schema
# Avoid configuring this at org level — link only the repos relevant to this project.
# See: https://docs.coderabbit.ai/knowledge-base/multi-repo-analysis
#
# To enable, uncomment the block below and replace the example values with your repos.
# knowledge_base:
#   linked_repositories:
#     - repository: "AOSSIE-Org/backend-api"
#       instructions: "Contains REST API endpoints and database models"

chat:
  # CodeRabbit will automatically respond to @coderabbitai mentions in PR comments
  auto_reply: true

issue_enrichment:
  labeling:
    auto_apply_labels: true
    labeling_instructions:
      - label: bug
        instructions: Issues reporting configuration bugs, broken policy settings, YAML syntax errors, or workflow execution failures.
      - label: enhancement
        instructions: Requests to add new sub-org policies, refine branch protections, update rulesets, or enhance automated sync workflows.
      - label: documentation
        instructions: Updates to README.md, policy manuals, setup guides, or best practices documentation.
  planning:
    enabled: true
    auto_planning:
      enabled: true
      labels:
        - "plan-me" # Auto-plan issues with this label
        - "feature" # Also auto-plan these
        - "!no-plan" # Never auto-plan issues with this label

reviews:
  profile: assertive # Options: chill (focuses on significant issues, less nitpicky about style), assertive (more thorough, flags style issues and minor improvements too)

  auto_review:
    # Automatically trigger reviews when PRs are opened or updated
    enabled: true
    # Skip auto-review if PR title contains these keywords
    ignore_title_keywords:
      - "WIP"
    # Don't auto-review draft PRs
    drafts: false
    # Only auto-review PRs targeting these branches
    base_branches:
      - main

  # Include a high-level summary at the start of each review
  high_level_summary: true

  # Generate sequence diagrams for complex code flows
  sequence_diagrams: true

  # Include poems in reviews
  poem: true

  # Show review completion status
  review_status: true

  # Keep the walkthrough section expanded by default
  collapse_walkthrough: false

  # Include summary of all changed files
  changed_files_summary: true

  # Automatically request changes on the PR (just leave comments)
  request_changes_workflow: true

  # Pre-merge checks to enforce before merging PRs
  pre_merge_checks:
    description:
      # Validate that PR has a proper description
      mode: warning # Options: off, warning, error
    docstrings:
      # Disable docstring coverage checks (let's assume we don't need them)
      mode: off

  # Exclude these paths from reviews (build artifacts and dependencies)
  path_filters:
    - "!**/node_modules/**"
    - "!**/dist/**"

  tools:
    yamllint:
      enabled: true
    markdownlint:
      enabled: true
    gitleaks:
      enabled: true
    shellcheck:
      enabled: true
    github-checks:
      enabled: true
      timeout_ms: 90000
    eslint:
      enabled: true

  labeling_instructions:
    - label: Safe-Settings Policy
      instructions: Apply when PR modifies .github/settings.yml, .github/suborgs/, .github/repos/, or deployment-settings.yml
    - label: Workflow
      instructions: Apply when PR modifies files inside .github/workflows/
    - label: Documentation
      instructions: Apply whenever README.md or project markdown docs are updated

  instructions:
    - Verify that all YAML safe-settings files follow valid safe-settings schema syntax
    - Confirm that sub-organization mappings under .github/suborgs/ contain valid repo lists
    - Check that secret references in GitHub Action workflows use secret masks (e.g. secrets.SAFE_SETTINGS_PRIVATE_KEY)
    - Ensure documentation is accurate, clear, and up-to-date

  path_instructions:
    - path: "**/*.yml"
      instructions: |
        Safe-Settings & Workflow YAMLs:
        - Ensure strict indentation (2 spaces)
        - Validate key names against safe-settings specification (repository, branches, labels, suborgrepos, restrictedRepos)
        - Verify environment variable substitutions use standard GitHub Actions syntax
    - path: "**/*.md"
      instructions: |
        Markdown Documentation:
        - Check for broken relative links and clear markdown hierarchy (h1, h2, h3)
        - Ensure clean formatting without trailing whitespace
